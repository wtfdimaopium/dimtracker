<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DimTracker">
<meta name="theme-color" content="#0c0c0e">
<title>DimTracker</title>
<style>
:root{--bg:#0c0c0e;--card:#17171a;--field:#1f1f23;--line:#2a2a2e;--fg:#f4f4f5;--mut:#8a8a92;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--gray:#52525b;--r:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 96px}
h1{font-size:34px;line-height:1.05;margin:28px 0 8px;font-weight:800;letter-spacing:-.03em}
h2{font-size:22px;margin:40px 0 12px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 20px}
input,textarea{width:100%;padding:15px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--field);font:inherit;color:var(--fg);margin-bottom:10px}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
textarea{min-height:120px;resize:vertical}
button{border:0;border-radius:var(--r);padding:15px 22px;font:inherit;font-weight:700;background:var(--green);color:#04120a;cursor:pointer}
button:disabled{opacity:.5}
button.ghost{background:var(--field);color:var(--fg)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.row input.min{flex:0 0 110px}
.err{color:#f87171;min-height:22px;margin:6px 0 0;font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top b{font-size:20px;letter-spacing:-.02em}
.top span{color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.top button{padding:9px 16px;font-size:14px}
.strip{display:flex;gap:8px;margin:18px 0 8px}
.chip{flex:1;min-width:0;background:var(--field);color:var(--fg);border-radius:18px;padding:10px 0 8px;text-align:center;font-weight:700;line-height:1.15}
.chip small{display:block;font-size:11px;font-weight:500;color:var(--mut)}
.chip .dot{display:block;width:6px;height:6px;border-radius:50%;margin:5px auto 0;background:transparent}
.chip.has .dot{background:var(--blue)}
.chip.on{background:var(--green);color:#04120a}
.chip.on small{color:#04120a}
.chip.on .dot{background:#04120a}
.day{text-align:center;color:var(--mut);margin:22px 0 4px}
.total{font-size:84px;line-height:1;font-weight:800;letter-spacing:-.05em;text-align:center;margin:4px 0 0}
.totalSub{text-align:center;color:var(--mut);margin:0 0 8px;font-size:15px}
.item{--c:var(--gray);background:var(--card);border-radius:var(--r);border-left:5px solid var(--c);padding:16px 18px;margin-bottom:12px}
.item.green{--c:var(--green)}.item.blue{--c:var(--blue)}.item.purple{--c:var(--purple)}
.item .d{font-weight:800;font-size:19px;line-height:1.25;word-break:break-word}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{border-radius:12px;padding:4px 12px;font-size:14px;font-weight:600;background:var(--field);color:var(--fg)}
.pill.cat{color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:999px}
.pill.score{background:var(--c);color:#04120a;border-radius:999px}
.item .note{color:var(--mut);font-size:15px;margin-top:10px}
.del{background:none;color:var(--mut);padding:0;font-weight:500;font-size:14px;margin-top:10px;border-radius:8px}
.empty{color:var(--mut);padding:8px 0;text-align:center}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<section id="auth" class="hide">
  <h1>DimTracker</h1>
  <p class="sub">Записывай, что сделал за день. ИИ оценит, насколько это полезно.</p>
  <input id="email" type="email" placeholder="Почта" autocomplete="email">
  <input id="pass" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
  <div class="row">
    <button id="btnIn">Войти</button>
    <button id="btnUp" class="ghost">Регистрация</button>
  </div>
  <p class="err" id="authErr"></p>
</section>

<section id="app" class="hide">
  <div class="top"><b>DimTracker</b><span id="who"></span><button id="btnOut" class="ghost">Выйти</button></div>
  <div class="strip" id="strip"></div>
  <div class="day" id="dayName"></div>
  <div class="total" id="total">0</div>
  <p class="totalSub" id="totalSub">баллов за день</p>

  <h2>Что ты сделал</h2>
  <input id="desc" type="text" placeholder="Например: написал авторизацию для проекта" maxlength="500">
  <div class="row">
    <input id="mins" class="min" type="number" min="0" max="1440" placeholder="Минут">
    <button id="btnAdd">Добавить</button>
  </div>
  <p class="err" id="addErr"></p>

  <div id="list"></div>

  <h2>Мои цели</h2>
  <p class="sub">Опиши, к чему ты идёшь и что для тебя полезно. ИИ будет оценивать занятия по этому тексту.</p>
  <textarea id="goals" placeholder="Например: хочу стать веб-разработчиком. Проекты и практика важнее видео. Английский нужен каждый день."></textarea>
  <button id="btnGoals">Сохранить цели</button>
  <p class="err" id="goalsErr"></p>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://sohkreezeatwpfetfvub.supabase.co';
const SUPABASE_KEY = 'sb_publishable_rttIOP7SETBN9v5n1Sgd0A_YPw8kMtc';
// Включим на следующем шаге, когда появится функция оценки
const AI_ENABLED = true;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let user = null;
let all = [];
let selected = startOfDay(new Date());

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function say(id, text) { $(id).textContent = text || ''; }

// Вход / регистрация
$('btnIn').onclick = async () => {
  say('authErr', '');
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (error) say('authErr', 'Не удалось войти: ' + error.message);
};
$('btnUp').onclick = async () => {
  say('authErr', '');
  const { data, error } = await sb.auth.signUp({ email: $('email').value.trim(), password: $('pass').value });
  if (error) return say('authErr', 'Не удалось зарегистрироваться: ' + error.message);
  if (!data.session) say('authErr', 'Проверь почту: нужно подтвердить адрес.');
};
$('btnOut').onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_event, session) => {
  setTimeout(() => setUser(session ? session.user : null), 0);
});

function setUser(u) {
  const changed = (u && u.id) !== (user && user.id);
  user = u;
  $('auth').classList.toggle('hide', !!u);
  $('app').classList.toggle('hide', !u);
  if (u && changed) {
    $('who').textContent = u.email;
    loadGoals();
    loadWeek();
  }
}

// Цели
async function loadGoals() {
  const { data } = await sb.from('profiles').select('goals').eq('id', user.id).maybeSingle();
  $('goals').value = data ? data.goals : '';
}
$('btnGoals').onclick = async () => {
  say('goalsErr', '');
  const { error } = await sb.from('profiles').upsert({ id: user.id, goals: $('goals').value });
  say('goalsErr', error ? 'Не удалось сохранить: ' + error.message : 'Цели сохранены.');
};

// Записи за последние 7 дней
async function loadWeek() {
  const from = startOfDay(new Date()); from.setDate(from.getDate() - 6);
  const { data, error } = await sb.from('activities').select('*')
    .gte('created_at', from.toISOString()).order('created_at', { ascending: false });
  if (error) return say('addErr', 'Не удалось загрузить записи: ' + error.message);
  all = data || [];
  renderStrip();
  renderDay();
}

function renderStrip() {
  const strip = $('strip');
  strip.textContent = '';
  const withEntries = new Set(all.map(a => dayKey(new Date(a.created_at))));
  const months = ['янв.', 'февр.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
  for (let i = 6; i >= 0; i--) {
    const d = startOfDay(new Date()); d.setDate(d.getDate() - i);
    const b = document.createElement('button');
    b.className = 'chip' + (dayKey(d) === dayKey(selected) ? ' on' : '') + (withEntries.has(dayKey(d)) ? ' has' : '');
    b.append(String(d.getDate()));
    const m = document.createElement('small'); m.textContent = months[d.getMonth()];
    const dot = document.createElement('span'); dot.className = 'dot';
    b.append(m, dot);
    b.onclick = () => { selected = d; renderStrip(); renderDay(); };
    strip.appendChild(b);
  }
}

function tone(s) { return s == null ? '' : s >= 8 ? 'purple' : s >= 3 ? 'green' : 'blue'; }

function renderDay() {
  const items = all.filter(a => dayKey(new Date(a.created_at)) === dayKey(selected));
  const isToday = dayKey(selected) === dayKey(new Date());
  let name = selected.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  name = name.charAt(0).toUpperCase() + name.slice(1);
  $('dayName').textContent = isToday ? 'Сегодня, ' + name.toLowerCase() : name;

  const list = $('list');
  list.textContent = '';
  let total = 0, pending = 0;
  if (!items.length) {
    const e = document.createElement('p');
    e.className = 'empty';
    e.textContent = 'В этот день записей нет. Добавь занятие выше.';
    list.appendChild(e);
  }
  for (const it of items) {
    if (it.score == null) pending++; else total += Number(it.score);
    const card = document.createElement('div');
    card.className = 'item ' + tone(it.score);
    const d = document.createElement('div'); d.className = 'd'; d.textContent = it.description;
    card.appendChild(d);
    const pills = document.createElement('div'); pills.className = 'pills';
    const add = (cls, text) => { const p = document.createElement('span'); p.className = 'pill ' + cls; p.textContent = text; pills.appendChild(p); };
    if (it.minutes) add('', it.minutes + ' мин');
    if (it.category) add('cat', it.category);
    add(it.score == null ? '' : 'score', it.score == null ? 'без оценки' : '+' + it.score);
    card.appendChild(pills);
    if (it.ai_comment) { const c = document.createElement('div'); c.className = 'note'; c.textContent = it.ai_comment; card.appendChild(c); }
    const del = document.createElement('button'); del.className = 'del'; del.textContent = 'Удалить';
    del.onclick = async () => { await sb.from('activities').delete().eq('id', it.id); loadWeek(); };
    card.appendChild(del);
    list.appendChild(card);
  }
  $('total').textContent = Math.round(total * 10) / 10;
  $('totalSub').textContent = pending ? 'баллов за день, без оценки: ' + pending : 'баллов за день';
}

// Добавить запись (в выбранный день)
$('btnAdd').onclick = async () => {
  say('addErr', '');
  const description = $('desc').value.trim();
  if (!description) return say('addErr', 'Напиши, что ты сделал.');
  const minutes = parseInt($('mins').value, 10);
  const row = { description, minutes: Number.isFinite(minutes) ? minutes : null };
  if (dayKey(selected) !== dayKey(new Date())) {
    row.created_at = new Date(selected.getFullYear(), selected.getMonth(), selected.getDate(), 12).toISOString();
  }
  $('btnAdd').disabled = true;
  const { data, error } = await sb.from('activities').insert(row).select().single();
  if (error) {
    say('addErr', 'Не удалось добавить: ' + error.message);
  } else {
    $('desc').value = ''; $('mins').value = '';
    if (AI_ENABLED) {
      const r = await sb.functions.invoke('score-activity', { body: { id: data.id } });
      if (r.error) say('addErr', 'Запись сохранена, но ИИ не смог её оценить.');
    }
    loadWeek();
  }
  $('btnAdd').disabled = false;
};
</script>
</body>
</html>
